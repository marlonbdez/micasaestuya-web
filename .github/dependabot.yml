version: 2
updates:
  # Las versiones mayores rompen la instalación en cadena (peer dependencies):
  # se hacen a mano, como tarea propia. Aquí solo menores y parches, agrupados
  # en una PR para que la CI los pruebe juntos.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Van juntos y cada uno exige la versión del otro (nuxt 3.21 pide un
      # test-utils que pide vitest 3; pinia/nuxt 0.5+ pide pinia 3): se
      # actualizan a mano, con la migración a Nuxt 4.
      - dependency-name: 'nuxt'
      - dependency-name: '@nuxt/test-utils'
      - dependency-name: '@pinia/nuxt'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/coverage-v8'
      - dependency-name: 'eslint-plugin-vitest'
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']

  # Node se fija por ADR (ADR 004), no por Dependabot.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
