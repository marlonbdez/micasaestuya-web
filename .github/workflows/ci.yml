name: Web CI

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test-unit:
    name: Unit tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit:coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # nuxt.config.ts sets nitro.preset to "static", so "nuxt build" does not
      # emit a usable .output (see docs/tooling.md #4). "generate" is what
      # Dockerfile.prod and Netlify actually run, and what gets deployed.
      - run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE: https://micasaestuya-api.onrender.com/api
      - uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: .output/public
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/2)
    if: github.ref != 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-20.18.0-chrome-130.0.6723.69-1-ff-131.0.3-edge-130.0.2849.52-1
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: build-output
          path: .output/public
      # No server output exists for a static preset, so we serve the static
      # build the same way Netlify does, instead of "nuxt start" (which
      # needs .output/server and never gets built here - see docs/tooling.md #4).
      #
      # This job runs in a `container:`, where each step is its own
      # `docker exec` - a process backgrounded with "&" in one step does not
      # survive into the next one, so "serve" got killed before Cypress ever
      # ran. Starting the server, waiting for it, and running Cypress all in
      # one step keeps it alive for the step's whole duration - see
      # docs/tooling.md #6.
      - name: Serve static build and run Cypress shard
        env:
          CI_NODE_INDEX: ${{ matrix.shard }}
          CI_NODE_TOTAL: 2
          # cypress/support/e2e.ts pings NUXT_PUBLIC_API_BASE/health in a
          # global "before all" hook to wake the Render API from sleep. If
          # this isn't set, it falls back to http://localhost:3001/api,
          # which nothing serves here - see docs/tooling.md #5.
          NUXT_PUBLIC_API_BASE: https://micasaestuya-api.onrender.com/api
        run: |
          npx --yes serve -s .output/public -l 3000 &
          npx --yes wait-on http://localhost:3000
          SPEC_FILES=$(node cypress/cypress-parallel.mjs)
          npx cypress run --browser chrome --spec "$SPEC_FILES"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cypress-artifacts-${{ matrix.shard }}
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 1

  accessibility:
    name: Accessibility check
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run generate
      - name: Serve static build
        run: npx --yes serve -s .output/public -l 5000 &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:5000
      - name: Run pa11y-ci
        continue-on-error: true
        run: npx --yes pa11y-ci http://localhost:5000

  publish-docker:
    name: Publish Docker image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
