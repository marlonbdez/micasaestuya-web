name: Web CI

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test-unit:
    name: Unit tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: https://micasaestuya-api.onrender.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .output
            .nuxt
          retention-days: 1

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/2)
    if: github.ref != 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-20.18.0-chrome-130.0.6723.69-1-ff-131.0.3-edge-130.0.2849.52-1
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Cypress shard
        env:
          CI_NODE_INDEX: ${{ matrix.shard }}
          CI_NODE_TOTAL: 2
        run: |
          SPEC_FILES=$(node cypress/cypress-parallel.mjs)
          npm run test:e2e:parallel $SPEC_FILES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-artifacts-${{ matrix.shard }}
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 1

  accessibility:
    name: Accessibility check
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run generate
      - name: Serve static build
        run: npx --yes serve -s .output/public -l 5000 &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:5000
      - name: Run pa11y-ci
        continue-on-error: true
        run: npx --yes pa11y-ci http://localhost:5000

  publish-docker:
    name: Publish Docker image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
