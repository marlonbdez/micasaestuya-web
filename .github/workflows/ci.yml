name: Web CI

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run knip

  test-unit:
    name: Unit tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit:coverage
      - uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'
        with:
          vite-config-path: vitest.config.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # nuxt.config.ts sets nitro.preset to "static", so "nuxt build" does not
      # emit a usable .output (see docs/tooling.md § 2). "generate" is what
      # Dockerfile.prod and Netlify actually run, and what gets deployed.
      - run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE: https://micasaestuya-api.onrender.com/api
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .output/public
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/2)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-20.18.0-chrome-130.0.6723.69-1-ff-131.0.3-edge-130.0.2849.52-1
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The tests never talk to production: they run against a throwaway API
    # with its own empty databases, reachable from the job by service name.
    services:
      mongo:
        image: mongo:6
      redis:
        image: redis:7-alpine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: marlonbdez/micasaestuya-api
          path: api
      - run: npm ci
      - run: npm ci
        working-directory: api
      # The API URL is baked into the static build, so this job generates its
      # own build pointing at the throwaway API instead of reusing the one
      # from the "build" job, which points at production.
      - run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:3001/api
      # This job runs in a `container:`, where each step is its own
      # `docker exec` - a process backgrounded with "&" in one step does not
      # survive into the next one. So the API, the static server, the wait
      # and Cypress all live in one step - see docs/tooling.md § 4.
      # NODE_ENV=test turns the rate limit off (api/utils/rateLimit.js).
      - name: Start API, serve static build and run Cypress shard
        env:
          CI_NODE_INDEX: ${{ matrix.shard }}
          CI_NODE_TOTAL: 2
          NUXT_PUBLIC_API_BASE: http://localhost:3001/api
        run: |
          NODE_ENV=test PORT=3001 SECRET=ci-e2e-secret \
            MONGODB_URI=mongodb://mongo:27017/micasaestuya_e2e \
            REDIS_TEST_URI=redis://redis:6379 \
            node api/index.js &
          npx --yes serve -s .output/public -l 3000 &
          npx --yes wait-on http://localhost:3001/api/health http://localhost:3000
          SPEC_FILES=$(node cypress/cypress-parallel.mjs)
          npx cypress run --browser chrome --spec "$SPEC_FILES"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-artifacts-${{ matrix.shard }}
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 1

  accessibility:
    name: Accessibility check
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run generate
      - name: Serve static build
        run: npx --yes serve -s .output/public -l 5000 &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:5000
      - name: Run pa11y-ci
        continue-on-error: true
        run: npx --yes pa11y-ci http://localhost:5000

  lighthouse:
    name: Lighthouse
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/download-artifact@v5
        with:
          name: build-output
          path: .output/public
      - uses: treosh/lighthouse-ci-action@v12
        id: lighthouse
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - name: Build the report
        if: always()
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
        run: node .github/scripts/lighthouse-report.mjs | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: marocchino/sticky-pull-request-comment@v3
        if: always()
        with:
          header: lighthouse
          path: report.md

  publish-docker:
    name: Publish Docker image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
